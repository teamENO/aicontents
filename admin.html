<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>管理者投稿</title>

<style>
body{
  background:#1f2937;
  color:white;
  font-family:sans-serif;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:#374151;
  padding:20px;
  border-radius:12px;
}

input,textarea{
  width:100%;
  padding:12px;
  box-sizing:border-box;
  border:none;
  border-radius:8px;
}

textarea{
  min-height:150px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:gold;
  color:black;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>👑 Admin投稿</h2>



<textarea id="comment"
placeholder="コメント"></textarea>

<br><br>

<button onclick="send()">
管理者として投稿
</button>

</div>
</div>

<script>
async function send(){

  const comment =
    document.getElementById("comment").value.trim();

  if(!comment){
    alert("コメントを入力してください");
    return;
  }

  try {

    const response = await fetch(API_URL,{
      method:"POST",
      body:JSON.stringify({
        name:"OWNER",
        comment:comment,
        adminPassword:"owner"
      })
    });

    const result = await response.text();

    console.log(result);
    alert("送信成功\n" + result);

    document.getElementById("comment").value="";

  } catch(error){

    console.error(error);
    alert("送信失敗");
  }
}</script>

</body>
</html>
