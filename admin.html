<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OWNER投稿</title>

<style>
body{
  background:#1f2937;
  color:white;
  font-family:sans-serif;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:#374151;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}

h2{
  text-align:center;
  color:gold;
}

textarea{
  width:100%;
  min-height:150px;
  padding:12px;
  box-sizing:border-box;
  border:none;
  border-radius:8px;
  resize:vertical;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:gold;
  color:black;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#ffd700;
}

button:disabled{
  opacity:.7;
}

#status{
  margin-top:10px;
  text-align:center;
}
</style>

</head>
<body>

<div class="container">
  <div class="card">

    <h2>OWNER投稿</h2>

    <textarea
      id="comment"
      placeholder="コメントを入力"></textarea>

    <br><br>

    <button
      id="sendButton"
      onclick="send()">
      管理者として投稿
    </button>

    <div id="status"></div>

  </div>
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzh8H0pzgkAJ1jUOW1POgQRuS6malzSD69hbMc-39WiVi7POo23paWHTThWt5FCb_Nj5Q/exec";

const ADMIN_PASSWORD = "owner";

async function send(){

  const comment =
    document.getElementById("comment").value.trim();

  if(!comment){
    alert("コメントを入力してください");
    return;
  }

  const button =
    document.getElementById("sendButton");

  const status =
    document.getElementById("status");

  button.disabled = true;
  status.textContent = "送信中...";

 try{

  const response = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      name:"Owner",
      comment:comment,
      adminPassword:ADMIN_PASSWORD
    })
  });

  const result = await response.text();

  console.log(result);

  document.getElementById("comment").value = "";

  status.textContent = "✅ 投稿しました";

}catch(error){

  console.error(error);

  status.textContent = "❌ 送信失敗";

  alert(
    "送信失敗\n\n" +
    error.message
  );
}

  button.disabled = false;
}

</script>

</body>
</html>
