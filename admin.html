<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin投稿</title>

<style>
body{
  background:#1f2937;
  color:white;
  font-family:sans-serif;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:#374151;
  padding:20px;
  border-radius:12px;
}

textarea{
  width:100%;
  min-height:150px;
  padding:12px;
  box-sizing:border-box;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:gold;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
</style>

</head>
<body>

<div class="container">
<div class="card">

<h2>👑 OWNER投稿</h2>

<textarea
id="comment"
placeholder="コメントを入力"></textarea>

<br><br>

<button onclick="send()">
管理者として投稿
</button>

</div>
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzh8H0pzgkAJ1jUOW1POgQRuS6malzSD69hbMc-39WiVi7POo23paWHTThWt5FCb_Nj5Q/exec";

const ADMIN_PASSWORD = "owner";

async function send(){

  const comment =
    document.getElementById("comment").value.trim();

  if(!comment){
    alert("コメントを入力してください");
    return;
  }

  try{

    const response = await fetch(
      API_URL,
      {
        method:"POST",
        body:JSON.stringify({
          name:"OWNER",
          comment:comment,
          adminPassword:ADMIN_PASSWORD
        })
      }
    );

    const result =
      await response.json();

    console.log(result);

    document.getElementById("comment").value="";

    alert("投稿しました");

  }catch(error){

    console.error(error);
    alert("送信失敗");
  }
}

</script>

</body>
</html>
