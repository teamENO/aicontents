<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>
  <h2>コメント投稿</h2>

  <input type="text" id="name" placeholder="名前"><br><br>

  <textarea id="comment" rows="5" cols="40"
  placeholder="コメント"></textarea><br><br>

  <button onclick="send()">投稿</button>

  <script>
    async function send() {
      const data = {
        name: document.getElementById("name").value,
        comment: document.getElementById("comment").value
      };

      await fetch(
        "Apps ScriptのWebアプリURL",
        {
          method: "POST",
          body: JSON.stringify(data)
        }
      );

      alert("投稿しました");
    }
  </script>
</body>
</html>
