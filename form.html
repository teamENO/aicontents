<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>コメント投稿</title>

<style>
body{
  background:#f5f7fa;
  font-family:sans-serif;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input,textarea{
  width:100%;
  padding:12px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
}

textarea{
  min-height:150px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#0078d4;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#106ebe;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>コメント投稿</h2>

<input id="name" placeholder="名前">

<br><br>

<textarea id="comment"
placeholder="コメント"></textarea>

<br><br>

<button onclick="send()">
投稿
</button>

</div>
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/あなたのURL/exec";

async function send() {

  const name =
    document.getElementById("name").value.trim();

  const comment =
    document.getElementById("comment").value.trim();

  if (!name || !comment) {
    alert("名前とコメントを入力してください");
    return;
  }

  if (name.toUpperCase() === "Owner") {
    alert("この名前は使用できません");
    return;
  }

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      name,
      comment
    })
  });

  document.getElementById("name").value="";
  document.getElementById("comment").value="";

  alert("投稿しました");
}
</script>

</body>
</html>
