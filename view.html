<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>
<body>

<h2>コメント一覧</h2>
<div id="comments"></div>

<script>
async function loadComments() {

  const response = await fetch(
    "https://script.google.com/macros/s/AKfycbzh8H0pzgkAJ1jUOW1POgQRuS6malzSD69hbMc-39WiVi7POo23paWHTThWt5FCb_Nj5Q/exec"
  );

  const data = await response.json();

  let html = "";

  for(let i = 1; i < data.length; i++) {

    const name = escapeHtml(data[i][1]);

    const comment = escapeHtml(data[i][2])
      .replace(/\r?\n/g, "<br>");

    html += `
      <div class="comment">
        <b>${name}</b><br>
        ${comment}
        <hr>
      </div>
    `;
  }

  document.getElementById("comments").innerHTML = html;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

loadComments();
setInterval(loadComments, 5000);</script>

</body>
</html>
