<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>コメント一覧</title>

<style>

body{
  background:#f5f7fa;
  font-family:sans-serif;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.comment{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.comment-time{
  color:#888;
  font-size:12px;
}

.comment-name{
  color:#0078d4;
  font-weight:bold;
  margin-top:5px;
}

.comment-name.owner{
  background:
  linear-gradient(
    90deg,
    #ffd700,
    #fff176,
    #ffb300
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  font-weight:bold;
}

.comment-text{
  margin-top:8px;
  line-height:1.7;
}

</style>

</head>
<body>

<div class="container">

<h2>コメント一覧</h2>

<div id="comments">
読み込み中...
</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzh8H0pzgkAJ1jUOW1POgQRuS6malzSD69hbMc-39WiVi7POo23paWHTThWt5FCb_Nj5Q/exec";

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

async function loadComments(){

  const response =
    await fetch(API_URL);

  const data =
    await response.json();

  let html="";

  for(let i=data.length-1;i>=1;i--){

    const date =
      escapeHtml(data[i][0]);

    const name =
      escapeHtml(data[i][1]);

    const comment =
      escapeHtml(data[i][2])
      .replace(/\r?\n/g,"<br>");

    const isOwner =
      name.toUpperCase() === "Owner";

    html += `
      <div class="comment">

        <div class="comment-time">
          ${date}
        </div>

        <div class="comment-name ${isOwner ? "Owner" : ""}">
          ${isOwner ? " Owner" : name}
        </div>

        <div class="comment-text">
          ${comment}
        </div>

      </div>
    `;
  }

  document.getElementById("comments")
    .innerHTML = html;
}

loadComments();
setInterval(loadComments,2000);

</script>

</body>
</html>
