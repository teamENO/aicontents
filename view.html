<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>
body {
  margin: 0;
  padding: 20px;
  font-family: "Segoe UI", sans-serif;
  background: #f5f7fa;
}

.container {
  max-width: 800px;
  margin: 0 auto;
}

h2 {
  text-align: center;
  color: #333;
  margin-bottom: 25px;
}

.comment {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.2s;
}

.comment:hover {
  transform: translateY(-2px);
}

.comment-time {
  font-size: 12px;
  color: #888;
  margin-bottom: 6px;
}

.comment-name {
  color: #0078d4;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 8px;
}

.comment-text {
  color: #333;
  line-height: 1.6;
  word-break: break-word;
}

.status {
  text-align: center;
  color: #666;
  font-size: 12px;
  margin-bottom: 15px;
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .comment {
    padding: 12px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h2>コメント一覧</h2>

  <div class="status">
    5秒ごとに自動更新
  </div>

  <div id="comments">
    読み込み中...
  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzh8H0pzgkAJ1jUOW1POgQRuS6malzSD69hbMc-39WiVi7POo23paWHTThWt5FCb_Nj5Q/exec";

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

async function loadComments() {

  try {

    const response = await fetch(API_URL);
    const data = await response.json();

    let html = "";

    for (let i = data.length - 1; i >= 1; i--) {

      const datetime = escapeHtml(data[i][0]);
      const name = escapeHtml(data[i][1]);

      const comment = escapeHtml(data[i][2])
        .replace(/\r?\n/g, "<br>");

      html += `
      <div class="comment">
        <div class="comment-time">${datetime}</div>
        <div class="comment-name">${name}</div>
        <div class="comment-text">${comment}</div>
      </div>
      `;
    }

    document.getElementById("comments").innerHTML = html;

  } catch (error) {

    document.getElementById("comments").innerHTML =
      "<p>コメントの取得に失敗しました。</p>";

    console.error(error);
  }
}

loadComments();

setInterval(loadComments, 2000);

</script>

</body>
</html>
